services:
  # ============================================================================
  # DevOpsHub Backend API Service
  # Image: shivayadav70/devopshub-server:latest
  # ============================================================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: shivayadav70/devopshub-server:latest
    container_name: devopshub-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI:-mongodb+srv://shivpra75_db_user:2cPrMwLyX3BTdVIu@cluster70.frlkkwc.mongodb.net/devopshub?retryWrites=true&w=majority&appName=Cluster70}
      - CLIENT_URL=http://localhost
    networks:
      - devopshub-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # DevOpsHub Frontend Client Service (React SPA + Nginx Reverse Proxy)
  # Image: shivayadav70/devopshub-client:latest
  # ============================================================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: shivayadav70/devopshub-client:latest
    container_name: devopshub-client
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - devopshub-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  devopshub-network:
    driver: bridge
