# Default values for devopshub Helm Chart.
# Maintainer: shivprakash01 / shivayadav70

replicaCount:
  server: 2
  client: 2

image:
  server:
    repository: shivayadav70/devopshub-server
    tag: "latest"
    pullPolicy: Always
  client:
    repository: shivayadav70/devopshub-client
    tag: "latest"
    pullPolicy: Always

service:
  server:
    type: ClusterIP
    port: 5000
  client:
    type: LoadBalancer
    port: 80

env:
  PORT: "5000"
  NODE_ENV: "production"
  CLIENT_URL: "http://localhost"
  MONGO_URI: "mongodb+srv://shivpra75_db_user:2cPrMwLyX3BTdVIu@cluster70.frlkkwc.mongodb.net/devopshub?retryWrites=true&w=majority&appName=Cluster70"

resources:
  server:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  client:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

autoscaling:
  enabled: true
  server:
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80
  client:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

ingress:
  enabled: true
  className: "nginx"
  host: "devopshub.local"
