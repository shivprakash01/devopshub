apiVersion: apps/v1
kind: Deployment
metadata:
  name: devopshub-server
  namespace: devopshub
  labels:
    app.kubernetes.io/name: devopshub
    app.kubernetes.io/component: backend
    app.kubernetes.io/tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devopshub-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: devopshub-server
        app.kubernetes.io/name: devopshub
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: server
          image: shivayadav70/devopshub-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: devopshub-config
            - secretRef:
                name: devopshub-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
