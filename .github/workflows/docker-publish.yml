name: CI/CD - Build & Publish Docker Images

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test-and-publish:
    name: Test, Build & Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Server Dependencies & Run API Tests
        run: |
          cd server
          npm ci || npm install
          node src/tests/api.test.js

      - name: Set up QEMU for Multi-Platform Builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'shivayadav70' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ------------------------------------------------------------------------
      # Build & Push Backend API Server Image
      # ------------------------------------------------------------------------
      - name: Build and Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            shivayadav70/devopshub-server:latest
            shivayadav70/devopshub-server:${{ github.sha }}

      # ------------------------------------------------------------------------
      # Build & Push Frontend Client Image
      # ------------------------------------------------------------------------
      - name: Build and Push Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            shivayadav70/devopshub-client:latest
            shivayadav70/devopshub-client:${{ github.sha }}
