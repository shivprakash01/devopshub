name: CI/CD - Test, Build & Publish

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # ============================================================================
  # Job 1: Test Suite & Quality Verification
  # ============================================================================
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Server Dependencies
        run: |
          cd server
          npm install

      - name: Run Server API Tests
        run: |
          cd server
          node src/tests/api.test.js

      - name: Install & Verify Client Build
        run: |
          cd client
          npm install
          npm run build

  # ============================================================================
  # Job 2: Build & Push Docker Images
  # ============================================================================
  build-and-publish:
    name: Build & Push Docker Images
    needs: test
    runs-on: ubuntu-latest

    env:
      DOCKER_USER: 'shivayadav70'
      HAS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' || secrets.DOCKER_PASSWORD != '' || secrets.DOCKERHUB_PASSWORD != '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU for Multi-Arch Builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (if secret is configured)
        if: env.HAS_TOKEN == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME || 'shivayadav70' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_PASSWORD }}

      - name: Notice if Docker Hub Secrets are not set
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::warning title=Docker Hub Secret Missing::DOCKERHUB_TOKEN is not configured in GitHub repository secrets. Docker images will be built for verification, but not pushed. Add DOCKERHUB_TOKEN in Settings > Secrets to enable automated push."

      # ------------------------------------------------------------------------
      # Build & Push Backend API Server Image
      # ------------------------------------------------------------------------
      - name: Build & Push Backend Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: ${{ env.HAS_TOKEN == 'true' && github.event_name != 'pull_request' }}
          tags: |
            shivayadav70/devopshub-server:latest
            shivayadav70/devopshub-server:${{ github.sha }}

      # ------------------------------------------------------------------------
      # Build & Push Frontend Client Image
      # ------------------------------------------------------------------------
      - name: Build & Push Frontend Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: ${{ env.HAS_TOKEN == 'true' && github.event_name != 'pull_request' }}
          tags: |
            shivayadav70/devopshub-client:latest
            shivayadav70/devopshub-client:${{ github.sha }}
